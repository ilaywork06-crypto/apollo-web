<!doctype html>
<!-- Source of assets/img/og-image.png (the link preview in WhatsApp and Facebook). See README to regenerate. -->
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@700;900&family=Rubik:wght@400;600;700;800&display=swap">
<link rel="stylesheet" href="../assets/css/site.css">
<style>
  html, body { width: 1200px; height: 630px; margin: 0; overflow: hidden; }
  body { background: var(--paper); }
  .og { display: grid; grid-template-columns: 1fr 420px; gap: 56px; align-items: center; height: 100%; padding: 0 72px; }
  .og-brand { display: flex; align-items: center; gap: 12px; margin-bottom: 28px; }
  .og-brand img { width: 40px; height: 46px; }
  .og-brand b { font-family: var(--font-display); font-weight: 900; font-size: 30px; }
  .og-brand span { color: var(--ink-3); font-weight: 600; font-size: 20px; padding-inline-start: 12px; border-inline-start: 2px solid var(--line); }
  .og h1 { font-family: var(--font-display); font-weight: 900; font-size: 64px; line-height: 1.08; letter-spacing: -0.015em; }
  .og h1 em { font-style: normal; color: var(--cobalt); display: block; }
  .og p { margin-top: 22px; font-size: 24px; color: var(--ink-2); }
  .og .insight { margin: 0; width: 420px; transform: rotate(-2deg); animation: none; }
  .og .ring-fill { animation: none; }
  .og .insight-ring { width: 110px; height: 110px; }
</style>
</head>
<body>
  <div class="og">
    <div>
      <div class="og-brand"><img src="../assets/img/logo.svg" alt=""><b>עמוס עטיה</b><span class="og-role">תכנון פנסיוני</span></div>
      <h1>אתם רואים כמה יש לכם. <em>אנחנו מראים כמה יכול היה להיות.</em></h1>
      <p>כל קופה, קרן ופוליסה שלכם, מול כל השוק.</p>
    </div>
    <div class="insight">
      <div class="insight-head">
        <span class="insight-brand">AmoSight</span>
        <span class="insight-sub">קרן השתלמות, מול 58 קופות באותה רמת סיכון</span>
      </div>
      <div class="insight-main">
        <svg class="insight-ring" viewBox="0 0 96 96"><circle cx="48" cy="48" r="40" class="ring-track"></circle><circle cx="48" cy="48" r="40" class="ring-fill"></circle><text x="48" y="48">38.6</text></svg>
        <div class="insight-facts">
          <div class="insight-label">AmoScore</div>
          <div class="insight-rank">מקום 41 מתוך 58</div>
          <div class="insight-bars">
            <div class="ibar"><span>שלכם</span><b style="--w: 70%" class="ibar-you"></b><em>10.4%</em></div>
            <div class="ibar"><span>המובילה</span><b style="--w: 100%" class="ibar-top"></b><em>14.9%</em></div>
          </div>
        </div>
      </div>
      <div class="insight-foot"><span>השנה החמצתם</span><strong><bdi dir="ltr">+₪7,598</bdi></strong></div>
    </div>
  </div>
</body>
</html>
